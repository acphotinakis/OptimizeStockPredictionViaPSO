name: Gitleaks Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/gitleaks.tar.gz \
            -C "$HOME/.local/bin" \
            gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Scan current checkout
        shell: bash
        run: |
          gitleaks dir \
            --redact \
            --exit-code 1 \
            .

      - name: Scan complete Git history
        shell: bash
        run: |
          gitleaks git \
            --redact \
            --exit-code 1 \
            .
