# ============================================================================
# CANONICAL CONFIGURATION (FINAL_PLAN.md)
# ============================================================================
# This configuration file implements the authoritative evaluation protocol
# defined in FINAL_PLAN.md. It supersedes all prior configuration files.
#
# Protocol Version: CANONICAL 1.0
# Source Document: FINAL_PLAN.md
# Date: April 21, 2026
# ============================================================================

# ============================================================================
# LOGGING
# ============================================================================
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/canonical_evaluation.log"

# ============================================================================
# OUTPUT
# ============================================================================
output:
  results_dir: "results/canonical"
  save_predictions: true
  save_backtests: true
  save_metrics: true
  save_frozen_state: true

# ============================================================================
# PROTOCOL ENFORCEMENT
# ============================================================================
enforcement:
  # These flags enforce FINAL_PLAN.md compliance
  allow_retraining: false           # FORBIDDEN
  allow_pipeline_refitting: false   # FORBIDDEN
  allow_test_access_training: false  # FORBIDDEN
  allow_shuffling: false             # FORBIDDEN
  require_frozen_state: true         # MANDATORY
  require_chronological_splits: true # MANDATORY


# ============================================================================
# DATA CONFIGURATION
# ============================================================================
data:
  # Date ranges (example)
  start_date: "2020-01-01"
  end_date: "2023-12-31"
  
  # Market data
  freq: "1D"  # Daily data
  timezone: "America/New_York"
  
  # Data quality
  max_missing_fraction: 0.05
  max_ffill_bars: 5


# ============================================================================
# EVALUATION PROTOCOL (FINAL_PLAN.md Section 2)
# ============================================================================
evaluation:
  protocol_version: "CANONICAL_1.0"
  source_document: "FINAL_PLAN.md"
  
  # Temporal splits (MANDATORY)
  splits:
    train_pct: 0.70    # 70% earliest data
    val_pct: 0.10      # 10% next chronological block
    test_pct: 0.20     # 20% most recent data
  
  # Walk-forward configuration
  walk_forward:
    window_size: 20         # Fixed 20-day rolling window
    step_size: 1            # 1-day ahead prediction
    window_type: "rolling"  # NOT expanding
    retraining: false       # NEVER retrain models
  
  # Feature pipeline behavior
  pipeline:
    fit_once: true          # Fit on train ONLY
    freeze_forever: true    # NEVER refit
    refit_per_step: false   # FORBIDDEN
  
  # Backtesting configuration
  backtesting:
    transaction_cost: 0.0015  # 0.15% one-way
    slippage: 0.0             # Included in transaction_cost
    round_trip_cost: 0.0030   # 0.30% total
    initial_capital: 1.0
    signal_generation: "sign"  # sign(predicted_return)
    position_sizing: "fixed"   # ±1 (no leverage)

# ============================================================================
# BASELINE LSTM (FINAL_PLAN.md Section 4.1)
# ============================================================================
# Fixed hyperparameters - NEVER tuned
baseline_lstm:
  name: "Baseline-LSTM-CANONICAL"
  
  # Architecture (FIXED)
  units_1: 128
  units_2: 64
  dropout: 0.2
  activation: "relu"
  output_units: 1
  output_activation: "linear"
  
  # Training (FIXED)
  learning_rate: 0.001
  batch_size: 32
  epochs: 100
  optimizer: "adam"
  loss: "mse"
  
  # Early stopping
  early_stopping:
    enabled: true
    monitor: "val_loss"
    patience: 10
    restore_best_weights: true
  
  # Data handling
  shuffle: false  # MANDATORY
  validation_split: 0.10  # 10% of training for early stopping
  
  # Reproducibility
  random_seed: 42
  deterministic: true

# ============================================================================
# PSO-OPTIMIZED LSTM (FINAL_PLAN.md Section 4.2)
# ============================================================================
pso_lstm:
  name: "PSO-LSTM-CANONICAL"
  
  # PSO Phase 1: Hyperparameter Search
  pso:
    enabled: true
    n_particles: 20
    n_iterations: 50
    
    # IPSO configuration
    inertia_min: 0.4
    inertia_max: 0.9
    c1: 1.5  # Cognitive coefficient
    c2: 1.5  # Social coefficient
    v_clamp_fraction: 0.20
    
    # Search space
    search_space:
      epochs:
        min: 50
        max: 300
      units_1:
        min: 50
        max: 300
      units_2:
        min: 20
        max: 200
      learning_rate:
        min: 0.001
        max: 0.01
        scale: "log"
      dropout:
        min: 0.0
        max: 0.5
      batch_size:
        choices: [32, 64]
    
    # Fitness function
    fitness:
      mse_weight: 0.9
      msw_weight: 0.1  # Mean squared weights regularization
    
    random_seed: 42
  
  # PSO Phase 2: Final Training
  final_training:
    use_combined_data: true  # Train on 80% (train + val)
    early_stopping: false    # Use exact PSO epochs
  
  # Fixed parameters
  activation: "relu"
  output_units: 1
  output_activation: "linear"
  optimizer: "adam"
  loss: "mse"
  shuffle: false  # MANDATORY
  random_seed: 42
  deterministic: true

# ============================================================================
# XGBOOST (FINAL_PLAN.md Section 4.3)
# ============================================================================
xgboost:
  name: "XGBoost-CANONICAL"
  
  # Fixed hyperparameters
  objective: "reg:squarederror"
  max_depth: 6
  learning_rate: 0.05
  n_estimators: 500
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 1
  gamma: 0.0
  reg_alpha: 0.0
  reg_lambda: 1.0
  
  # Early stopping
  early_stopping_rounds: 50
  
  # Feature representation
  feature_type: "lag_based"  # NOT flattened sequences
  lookback: 20
  
  # Performance
  tree_method: "hist"  # CPU/GPU compatible
  max_bin: 256
  n_jobs: -1
  
  # Reproducibility
  random_state: 42

# ============================================================================
# FEATURE PIPELINE (FINAL_PLAN.md Section 3)
# ============================================================================
features:
  # Wavelet denoising
  wavelet:
    enabled: true
    wavelet: "haar"
    level: 3
    mode: "symmetric"
    # Threshold computed on TRAIN only, frozen forever
  
  # Feature selection (4-stage pipeline)
  selector:
    variance_threshold: 1.0e-6
    correlation_threshold: 0.95
    vif_threshold: 10.0
    mi_quantile_threshold: 0.25
  
  # MinMax scaling
  scaler:
    enabled: true
    feature_range: [-1.0, 1.0]
    # Parameters fit on TRAIN only, frozen forever
  
  # Windowing
  windowing:
    lookback: 20  # Fixed for all models
    prediction_horizon: 1  # 1-day ahead

