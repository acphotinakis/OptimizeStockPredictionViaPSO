  - SPY   # S&P 500 broad market (ALREADY HAVE)
  - QQQ   # Nasdaq 100 tech-heavy (NEED TO INGEST)
  - IWM   # Russell 2000 small caps (NEED TO INGEST)
  - DIA   # Dow Jones industrials (NEED TO INGEST)

