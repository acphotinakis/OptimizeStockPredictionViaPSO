# ============================================================================
# UNION CONFIGURATION (CANONICAL ∪ EXPERIMENTAL)
# Combines:
# - FINAL_PLAN.md Canonical TRD Configuration
# - PSO-LSTM Experimental Configuration
# ============================================================================

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/pso_lstm.log"

# ============================================================================
# OUTPUT (CANONICAL ONLY)
# ============================================================================
output:
  results_dir: "results/canonical"
  save_predictions: true
  save_backtests: true
  save_metrics: true
  save_frozen_state: true

# ============================================================================
# PROTOCOL ENFORCEMENT (CANONICAL ONLY)
# ============================================================================
enforcement:
  allow_retraining: false
  allow_pipeline_refitting: false
  allow_test_access_training: false
  allow_shuffling: false
  require_frozen_state: true
  require_chronological_splits: true

# ============================================================================
# DATA (UNION)
# ============================================================================
data:
  start_date: "2021-04-22"
  end_date: "2026-04-22"
  
  train_end: "2024-04-05"
  val_end: "2025-04-05" 
  test_end: "2026-04-05"
  
  # start_date: "2026-01-05"
  # end_date: "2026-04-05"
  train_years: 3
  val_years: 1
  test_years: 1
  
  # freq: "1Min"
  freq: "5Min"
  
  session_start: "09:30"
  session_end: "16:00"
  
  timezone: "America/New_York"
  
  benchmark_ticker: "SPY"
  
  max_missing_fraction: 0.05
  max_ffill_bars: 5


# ============================================================================
# FEATURES (UNION)
# ============================================================================
features:
  # Wavelet Denoising (TRD-required)
  wavelet:
    enabled: true            # Apply wavelet denoising (TRD §4.1)
    wavelet: "haar"
    level: 3
    mode: "symmetric"
  
  # Feature Selection (4-stage pipeline)
  selector:
    variance_threshold: 1.0e-6
    correlation_threshold: 0.95      # Zeng et al. 2025
    vif_threshold: 10.0               # Standard econometric
    mi_quantile_threshold: 0.25       # Keep top 75%
  
  # Cross-ticker Features
  cross_ticker:
    enabled: true
    spy_features: true
    peer_features: true
    peer_count: 3
    peer_corr_threshold: 0.3
    peer_corr_window: 252

  # MinMax scaling
  scalar:
    enabled: true
    feature_range: [-1.0, 1.0]
    # Parameters fit on TRAIN only, frozen forever
  
  # Windowing
  windowing:
    lookback: 20  # Fixed for all models
    prediction_horizon: 1  # 1-day ahead


# ============================================================================
# EVALUATION
# ============================================================================
evaluation:
  splits:
    train_pct: 0.70
    val_pct: 0.10
    test_pct: 0.20
  walk_forward:
    window_size: 20
    step_size: 1
    window_type: "rolling"
    retraining: false
  pipeline:
    fit_once: true
    freeze_forever: true
    refit_per_step: false



# ============================================================================
# LSTM BASELINE (UNION)
# ============================================================================
lstm_baseline:
  name: "LSTM-Baseline-v1.0"
  framework: "pytorch"
  lstm_units_1: 128
  lstm_units_2: 64
  dropout_rate: 0.2
  activation: "relu"
  output_units: 1
  output_activation: "linear"
  optimizer: "adam"
  learning_rate: 0.001
  loss: "mse"
  epochs: 100
  batch_size: 32
  shuffle: false
  lookback: 20
  prediction_horizon: 1
  random_seed: 42
  deterministic: true
  
  validation_split: 0.10

  # Early stopping
  early_stopping:
    enabled: true
    monitor: "val_loss"
    patience: 10
    restore_best_weights: true
  
  # Advanced Training
  grad_clip: 1.0
  use_amp: true
  accumulation_steps: 1



# ============================================================================
# XGBOOST (UNION)
# ============================================================================
xgboost:
  name: "XGBoost-v1.0"
  # Fixed hyperparameters
  objective: "reg:squarederror"
  max_depth: 6
  learning_rate: 0.05
  n_estimators: 500
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 1
  gamma: 0.0
  reg_alpha: 0.0
  reg_lambda: 1.0
  
  # Early stopping
  early_stopping_rounds: 50
  
  # Feature representation
  feature_type: "lag_based"  # NOT flattened sequences
  lookback: 20
  
  # Performance
  tree_method: "hist"  # CPU/GPU compatible
  max_bin: 256
  n_jobs: -1
  
  # Reproducibility
  random_seed: 42

  importance_type: "gain"


# ============================================================================
# PSO (UNION)
# ============================================================================
pso:
  # ================================================================
  # PSO HYPERPARAMETER OPTIMIZATION (Optional, disabled by default)
  # ================================================================
  enabled: false             # Set to true for hyperparameter optimization
  
  # Algorithm Parameters (IPSO - Improved PSO per Ji et al. 2021)
  n_particles: 20
  n_iterations: 50

  inertia_min: 0.4                 # Inertia weight minimum (adaptive)
  inertia_max: 0.9                 # Inertia weight maximum
  
  c1: 1.5                    # Cognitive coefficient
  c2: 1.5                    # Social coefficient
  
  v_clamp_fraction: 0.20     # Velocity clamping
  
  seed: 42
  lookback: 20
  
  # Search Space (LSTM Hyperparameters)
  search_space:
    lstm_units_1:
      min: 50
      max: 300
      step: 32
    lstm_units_2:
      min: 20
      max: 200
      step: 20
    dropout_rate:
      min: 0.0
      max: 0.5
    learning_rate:
      min: 0.001
      max: 0.01
      scale: "log"
    batch_size:
      choices: [32, 64]
    epochs:
      min: 50
      max: 300
  
  # Fixed parameters
  activation: "relu"
  output_units: 1
  output_activation: "linear"
  optimizer: "adam"
  loss: "mse"
  shuffle: false  # MANDATORY
  deterministic: true

  checkpoint_dir: "results/checkpoints"

  # Fitness function
  fitness:
    mse_weight: 0.9
    msw_weight: 0.1  # Mean squared weights regularization
    rmse_weight: 0.4
    sharpe_weight: 0.4
    drawdown_weight: 0.2
    signal_threshold: 1.0e-4
    transaction_cost: 0.001
  
  random_seed: 42



# ============================================================================
# BACKTESTING (UNION)
# ============================================================================
backtesting:
  transaction_cost: 0.0015
  slippage: 0.0005
  position_size: 1.0
  stop_loss: 0.02
  take_profit: null
  initial_capital: 100000.0
  position_fraction: 0.02
  daily_loss_limit: 0.05
  round_trip_cost: 0.0030
  signal_generation: "sign"
  position_sizing: "fixed"