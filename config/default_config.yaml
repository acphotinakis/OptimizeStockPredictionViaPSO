# PSO-LSTM Stock Price Prediction Configuration
# CSCI 633 — Biologically-Inspired Intelligent Systems
# March 2026

pso:
  n_particles: 30
  n_iterations: 50
  w_min: 0.4
  w_max: 0.9
  c1: 1.5
  c2: 1.5
  v_clamp_fraction: 0.20
  seed: 42
  checkpoint_dir: "results/checkpoints"
  n_workers: 1

lstm:
  # Search space bounds
  num_layers:
    min: 1
    max: 4
  hidden_units:
    min: 32
    max: 512
    step: 32
  dropout:
    min: 0.0
    max: 0.5
  learning_rate:
    min: 1.0e-5
    max: 1.0e-1
    scale: "log"
  lookback:
    choices: [10, 30, 60, 120]
  
  # Training settings
  max_epochs: 100
  batch_size: 256
  early_stopping_patience: 10
  grad_clip: 1.0

lstm_baseline:
  # Fixed hyperparameters (no PSO optimization)
  num_layers: 2
  hidden_units: 128
  dropout: 0.2
  learning_rate: 0.001
  lookback: 30
  max_epochs: 100
  patience: 10
  batch_size: 256
  
  # Training settings
  grad_clip: 1.0
  use_amp: true
  accumulation_steps: 1
  
  # Walk-forward validation
  wfv_fold_size: 252
  wfv_folds: 10
  
  # Backtesting
  initial_capital: 100000.0
  position_fraction: 0.02
  transaction_cost: 0.001
  slippage: 0.0005
  stop_loss: 0.02
  daily_loss_limit: 0.05

# --- XGBoost (Memory-Safe) ---
xgboost:
  objective: "reg:squarederror"
  # num_class: 3
  n_estimators: 200            # smaller model
  max_depth: 4                 # shallower trees
  learning_rate: 0.01
  subsample: 0.7               # reduce rows per tree
  colsample_bytree: 0.6        # reduce features per tree
  min_child_weight: 5          # avoid tiny leaf nodes
  gamma: 0.1                   # require gain to split
  reg_alpha: 0.0
  reg_lambda: 1.0
  early_stopping_rounds: 50
  use_optuna: true
  optuna_trials: 20            # fewer HPO trials
  tree_method: "gpu_hist"      # or "hist" if GPU memory is limited
  # tree_method: "hist"      # or "hist" if GPU memory is limited
  max_bin: 128                 # smaller bins → lower memory
  lookback: 30

fitness:
  rmse_weight: 0.4
  sharpe_weight: 0.4
  drawdown_weight: 0.2
  signal_threshold: 1.0e-4
  transaction_cost: 0.001

data:
  start_date: "2021-04-05"
  end_date: "2026-04-05"
  train_end: "2024-04-05"
  val_end: "2025-04-05" 
  test_end: "2026-04-05"
  # start_date: "2026-01-05"
  # end_date: "2026-04-05"
  train_years: 3
  val_years: 1
  test_years: 1
  freq: "1Min"
  session_start: "09:30"
  session_end: "16:00"
  timezone: "America/New_York"

features:
  selector:
    method: "xgboost"
    importance_threshold: 0.70
    xgb_params:
      n_estimators: 100
      max_depth: 4
      learning_rate: 0.1
      subsample: 0.8
      colsample_bytree: 0.8

backtesting:
  transaction_cost: 0.001
  slippage: 0.0005
  position_size: 1.0
  stop_loss: 0.02
  take_profit: null

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/pso_lstm.log"

